name: Deploy frontend to GitHub Pages

# Repo hiện dùng Settings → Pages → "Deploy from a branch" (main, /root): GitHub tự đăng mỗi lần push,
# index.html ở gốc chuyển sang frontend/. Workflow này chỉ dùng nếu đổi Source sang "GitHub Actions"
# — khi đó bật lại trigger push bên dưới.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Settings → Secrets and variables → Actions → Variables → L2A_API_BASE
      # (vd: https://link2audio-api.onrender.com). Bỏ trống thì giữ frontend/config.js.
      - name: Write API address into config.js
        env:
          API_BASE: ${{ vars.L2A_API_BASE }}
        if: ${{ vars.L2A_API_BASE != '' }}
        run: printf 'window.L2A_CONFIG = { apiBase: %s };\n' "$(jq -Rn --arg b "$API_BASE" '$b')" > frontend/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
